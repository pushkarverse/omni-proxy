name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Set up uv
      uses: astral-sh/setup-uv@v2
    - name: Install dependencies
      run: uv pip install --system -e .[dev]
    - name: Run Tests
      run: pytest
