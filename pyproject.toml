[project]
name = "omni-proxy"
version = "1.1.0"
description = "Convert Google Gemini & ChatGPT into OpenAI-compatible API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "httpx>=0.25",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
omni-proxy = "omni_apis.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omni_apis*"]
